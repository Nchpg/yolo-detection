[project]
name = "traffic-yolo"
version = "0.1.0"
description = "Detection de vehicules (Car, Number Plate, Blur Number Plate, Two Wheeler, Auto, Bus, Truck) avec YOLO"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "ultralytics>=8.3.0",
    "kagglehub>=0.3.0",
    "torch>=2.2",
    "torchvision>=0.17",
    "opencv-python-headless>=4.9",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "matplotlib>=3.8",
    "pandas>=2.2",
    "onnx>=1.22.0",
    "onnxslim>=0.1.96",
    "onnxruntime>=1.24.3",
]

[tool.uv]
package = false
# ultralytics tire opencv-python (build GUI) qui exige libxcb/libGL.
# On le neutralise : opencv-python-headless fournit le meme module cv2.
override-dependencies = ["opencv-python; python_version < '0'"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
