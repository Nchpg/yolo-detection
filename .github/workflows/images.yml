name: images

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Rien à compiler : l'image ne fait que poser `web/` derrière nginx, le
      # modèle étant exécuté par le navigateur du visiteur. Le `context` est la
      # racine du dépôt parce que le Dockerfile y prend sa configuration nginx,
      # qui vit à côté de lui.
      #
      # Le cache ne sert presque à rien ici, et c'est normal : la couche qui pèse
      # est la copie de `web/`, donc du modèle de 37 Mo, et le moindre changement
      # dans la page l'invalide. Il est gardé pour l'image de base.
      - id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/nchpg/yolo-detection:main
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # La référence COMPLÈTE, prête à coller dans profiles/server/default.nix
      # du dépôt d'infrastructure, qui épingle un digest et jamais un tag. Dans
      # le résumé du run plutôt que dans le journal : c'est la seule valeur
      # qu'on vient chercher après une publication, elle ne doit pas être à
      # dérouler au milieu de mille lignes de build.
      - name: digest
        run: |
          echo '`ghcr.io/nchpg/yolo-detection@${{ steps.push.outputs.digest }}`' >> "$GITHUB_STEP_SUMMARY"
