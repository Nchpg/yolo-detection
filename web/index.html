<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Traffic Vision — vehicle detection</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <h1>Traffic Vision</h1>
  <div class="status">
    <span class="led" id="led-model"><i></i>Model</span>
    <span class="led" id="led-video"><i></i>Source</span>
    <span class="led" id="led-run"><i></i>Inference</span>
  </div>
</header>

<main class="layout">

  <aside class="rail">

    <section class="panel">
      <h2>Video source</h2>
      <div class="drop" id="drop-video">
        <input type="file" id="file-video" accept="video/*" hidden>
        <p>Drop a video here</p>
        <button class="btn" id="btn-video">Browse</button>
      </div>
      <div class="samples" id="samples" hidden>
        <span class="samples-label">Samples</span>
        <div id="samples-list"></div>
      </div>
    </section>

    <section class="panel">
      <h2>Settings</h2>
      <label class="slider">
        <span>Confidence threshold</span><output id="out-conf">0.35</output>
        <input type="range" id="conf" min="0.05" max="0.95" step="0.01" value="0.35">
      </label>
      <label class="check"><input type="checkbox" id="opt-labels" checked><span>Show labels</span></label>
      <label class="check"><input type="checkbox" id="opt-scores" checked><span>Show scores</span></label>
    </section>

    <section class="panel grow">
      <h2>Classes</h2>
      <ul class="classes" id="classes"></ul>
    </section>

  </aside>

  <section class="stage-wrap">
    <div class="stage" id="stage">
      <video id="video" playsinline muted loop></video>
      <canvas id="overlay"></canvas>
      <p class="placeholder">Drop a video, or pick a sample.</p>
    </div>

    <div class="transport">
      <button class="btn btn-primary" id="btn-play" disabled>Start</button>
      <button class="btn" id="btn-snap" disabled>Save PNG</button>
      <input type="range" id="seek" class="seek" min="0" max="1000" step="1" value="0" disabled>
      <span class="time" id="t-time">0:00 / 0:00</span>
      <span class="gauge"><b id="t-ms">—</b> <span class="g-unit">ms</span></span>
      <span class="gauge"><b id="t-fps">—</b> <span class="g-unit">fps</span></span>
      <span class="gauge"><b id="t-n">—</b> <span class="g-unit">boxes</span></span>
    </div>

    <p class="hint" id="hint">Everything runs in the browser: no video is uploaded anywhere.</p>
  </section>

</main>

<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.23.0/dist/ort.all.min.js"></script>
<script src="detector.js"></script>
<script src="app.js"></script>
</body>
</html>
