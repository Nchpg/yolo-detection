# Server block for the static page, dropped into the nginx-unprivileged image
# as /etc/nginx/conf.d/default.conf.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The two headers web/vercel.json already sets, for the same reason:
    # onnxruntime-web only reaches its multithreaded WASM backend when the page
    # is cross-origin isolated, and that needs both of them. Without them
    # SharedArrayBuffer is gone and inference falls back to a single thread.
    #
    # `credentialless` and not `require-corp` because ort.all.min.js is pulled
    # from jsdelivr, which serves no Cross-Origin-Resource-Policy header — under
    # `require-corp` the runtime itself would be blocked.
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "credentialless" always;

    location / {
        try_files $uri $uri/ =404;
    }
}
